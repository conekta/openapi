get:
  tags:
    - Api Keys
  operationId: getApiKeys
  summary: Get list of Api Keys
  description: "Consume the list of api keys you have"
  responses:
    200:
      description: successful
      content:
        application/vnd.conekta-v2.3.0+json:
          schema:
            title: get_api_keys_response
            allOf:
              - $ref: ../../schemas/pagination/page.yml
              - $ref: ../../schemas/pagination/pagination.yml
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "../../schemas/api_keys/api_key_response.yml"
      headers:
        Content-Type:
          description: The format of the response body
          schema:
            type: string
            example: "application/json; charset=utf-8"
        Conekta-Media-Type:
          schema:
            type: string
            example: conekta-v2.3.0; format=application/json
    401:
      $ref: "../errors/401.yml"
    403:
      $ref: "../errors/403.yml"
    500:
      $ref: "../errors/500.yml"
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"
    - $ref: "../../parameters/commons/query/limit.yml"
    - $ref: "../../parameters/commons/query/next_page.yml"
    - $ref: "../../parameters/commons/query/previous_page.yml"
    - description: "General search, e.g. by id, description, prefix"
      in: query
      name: "search"
      required: false
      schema:
        type: string
post:
  tags:
    - Api Keys
  operationId: createApiKey
  summary: Create Api Key
  description: "Creates an api key. Private keys require at least one scope, and can be restricted to an IP whitelist and given an expiry."
  responses:
    200:
      description: successful operation
      content:
        application/vnd.conekta-v2.3.0+json:
          schema:
            title: api_key_create_response
            allOf:
              - type: object
                properties:
                  authentication_token:
                    type: string
                    example: key_u8jzPde0IgxLd6GncfBAepfJBd0Kh8oOOL8dKLzdocJ2isAjIhKtJ0RlgLKOmxgJTeKdNnFRIBXuDL7DxtpYlSXpfKtHF4vUCsMe
                    description: The full api key. Send it as a bearer token, or as the username of basic authentication with a blank password. For private keys it is returned only in this response, because Conekta does not store it; copy it to a secret manager right away.
              - $ref: "../../schemas/api_keys/api_key_response.yml"
      headers:
        Content-Type:
          description: The format of the response body
          schema:
            type: string
            example: "application/json; charset=utf-8"
        Conekta-Media-Type:
          schema:
            type: string
            example: conekta-v2.3.0; format=application/json
    401:
      $ref: "../errors/401.yml"
    403:
      $ref: "../errors/403.yml"
    422:
      $ref: "../errors/422.yml"
    500:
      $ref: "../errors/500.yml"
  security:
    - bearerAuth: []
  requestBody:
    $ref: "../../requestBodies/api_keys/api_keys_create.yml"
  parameters:
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"

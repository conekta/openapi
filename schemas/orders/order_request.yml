title: order_request
description: a order
type: object
required:
  - currency
  - customer_info
  - line_items
properties:
  charges:
    description: "List of [charges](https://developers.conekta.com/v2.3.0/reference/orderscreatecharge) that are applied to the order"
    type: array
    items:
      $ref: ../../schemas/charges/charge_request.yml
  checkout:
    $ref: ../../schemas/checkouts/checkout_request.yml
  currency:
    type: string
    description: >-
       Currency with which the payment will be made. It uses the 3-letter code of the [International Standard ISO 4217.](https://es.wikipedia.org/wiki/ISO_4217)
    example:  "MXN"
    maxLength: 3
  customer_info:
    description: "Customer information"
    oneOf:
      - $ref: ../customers/customer_info.yml
      - $ref: ../customers/customer_info_just_customer_id.yml
  discount_lines:
    description: "List of [discounts](https://developers.conekta.com/v2.3.0/reference/orderscreatediscountline) that are applied to the order."
    type: array
    items:
      $ref: order_discount_lines_request.yml
  fiscal_entity:
    title: order_fiscal_entity_request
    type: object
    description: "Fiscal entity of the order, Currently it is a purely informative field"
    required:
      - address
    properties:
      address: 
        $ref: fiscal_entity_address.yml
      email:
        type: string
        example: "test@gmail.com"
        description: "Email of the fiscal entity"
      metadata:
        type: object
        additionalProperties: true
        maxProperties: 100
        description: "Metadata associated with the fiscal entity"
      name:
        type: [string, "null"]
        example: "Conekta Inc"
        description: "Name of the fiscal entity"
      phone:
        type: string
        example: "+525511223344"
        description: "Phone of the fiscal entity"
      tax_id:
        type: [string, "null"]
        example: "AAA010101AAA"
        description: "Tax ID of the fiscal entity"
  line_items:
    description: "List of [products](https://developers.conekta.com/v2.3.0/reference/orderscreateproduct) that are sold in the order. You must have at least one product."
    type: array
    items:
      $ref: product.yml
  metadata:
    type: object
    additionalProperties:
      oneOf:
        - type: string
          maxLength: 249
        - type: integer
        - type: number
        - type: boolean
    maxProperties: 100
    description: "Metadata associated with the order. Values must be scalar (string of at most 249 characters, integer, number or boolean); nested objects and arrays are rejected."
  needs_shipping_contact:
    type: boolean
    example: false
    description: Allows you to fill out the shipping information at checkout
  pre_authorize:
    type: boolean
    description: "Indicates whether the order charges must be preauthorized"
  processing_mode:
    type: string
    description: "Indicates the processing mode for the order, either ecommerce, recurrent or validation."
    example: "ecommerce"
  return_url:
    type: string
    format: uri
    description: "Indicates the redirection callback upon completion of the 3DS2 flow. Do not use this parameter if your order has a checkout parameter"
    example: https://my-website.com
  shipping_contact:
    $ref: ../../schemas/customers/customer_shipping_contacts.yml
  shipping_lines:
    description: "List of [shipping costs](https://developers.conekta.com/v2.3.0/reference/orderscreateshipping). If the online store offers digital products."
    type: array
    items:
      $ref: ../../schemas/orders/shipping_request.yml
  tax_lines:
    description: "List of [taxes](https://developers.conekta.com/v2.3.0/reference/orderscreatetaxes) that are applied to the order."
    type: array
    items:
      $ref: order_tax_request.yml
  three_ds_mode:
    type: [string, "null"]
    enum: ["strict", "not_strict", "smart", null]
    description: "Indicates the 3DS2 mode: 'strict', 'not_strict' or 'smart'. Accepted on creation only. This property is only applicable when 3DS is enabled; when 3DS is disabled this field should be null (no 3DS flow is applied)."
    examples:
      - value: "smart"
        summary: "Risk-based 3DS: transactions that Conekta considers risky go through the 3DS2 verification flow (provided the issuing bank supports it); low-risk transactions continue without 3DS2 authentication."
      - value: "strict"
        summary: "All transactions require 3DS2 authentication as a complementary security measure, except those rejected by our Anti-Fraud. The issuing bank must support 3DS2."
      - value: "not_strict"
        summary: "The 3DS2 challenge is also always initiated; intended as the more lenient variant of 'strict' where authentication attempts may be accepted."

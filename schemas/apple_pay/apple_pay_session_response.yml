title: apple_pay_session_response
description: |
  Apple Pay merchant session returned by Apple. Pass this object as-is to
  `session.completeMerchantValidation` in the browser.
type: object
required:
  - epochTimestamp
  - expiresAt
  - merchantSessionIdentifier
  - nonce
  - merchantIdentifier
  - domainName
  - displayName
  - signature
properties:
  epochTimestamp:
    type: integer
    format: int64
    description: "Date and time, in milliseconds since epoch, when the session was created."
    example: 1758222248547
  expiresAt:
    type: integer
    format: int64
    description: "Date and time, in milliseconds since epoch, when the session expires."
    example: 1758225848547
  merchantSessionIdentifier:
    type: string
    description: "Unique identifier of the merchant session generated by Apple."
    example: "SSHC1DDFEB554674D38992774400AE24AB1_916523AAED1343F5BC5815E12BEE9250AFFDC1A17C46B0DE5A943F0F94927C24"
  nonce:
    type: string
    description: "Single-use value used by Apple to verify the session."
    example: "b94448de"
  merchantIdentifier:
    type: string
    description: "Hashed Apple Pay merchant identifier the session was validated with."
    example: "9358DF186D848FFCE03D9D5230EC85E0E3EA4175C0402A14D32A67504F2C6EBD"
  domainName:
    type: string
    description: "Domain the session was validated for."
    example: "pay.conekta.io"
  displayName:
    type: string
    description: "Merchant name shown in the Apple Pay sheet."
    example: "Conekta"
  signature:
    type: string
    description: "Apple signature of the session, in hexadecimal format."
    example: "308006092a864886f70d010702a0803080020101310d300b06096086480165030402013080..."
  operationalAnalyticsIdentifier:
    type: string
    description: "Identifier used by Apple for analytics purposes."
    example: "Conekta:9358DF186D848FFCE03D9D5230EC85E0E3EA4175C0402A14D32A67504F2C6EBD"
  retries:
    type: integer
    description: "Number of times the session validation has been retried."
    example: 0
  pspId:
    type: string
    description: "Payment service provider identifier assigned by Apple."
    example: "9358DF186D848FFCE03D9D5230EC85E0E3EA4175C0402A14D32A67504F2C6EBD"

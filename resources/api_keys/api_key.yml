get:
  tags:
    - Api Keys
  operationId: getApiKey
  summary: Get Api Key
  description: "Gets an api key that corresponds to an api key ID. The authentication_token of a private key is only returned when the key is created."
  responses:
    200:
      description: successful
      content:
        application/vnd.conekta-v2.3.0+json:
          schema:
            $ref: "../../schemas/api_keys/api_key_response.yml"
      headers:
        Content-Type:
          description: The format of the response body
          schema:
            type: string
            example: "application/json; charset=utf-8"
        Conekta-Media-Type:
          schema:
            type: string
            example: conekta-v2.3.0; format=application/json
    401:
      $ref: "../errors/401.yml"
    403:
      $ref: "../errors/403.yml"
    404:
      $ref: "../errors/404.yml"
    500:
      $ref: "../errors/500.yml"
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../parameters/commons/path_param/id.yml"
    - $ref: "../../parameters/commons/headers/accept_language.yml"
    - $ref: "../../parameters/commons/headers/x_child_company_id.yml"
put:
  tags:
    - Api Keys
  operationId: updateApiKey
  summary: Update Api Key
  description: "Updates an existing api key: activate or deactivate it, change its description, IP whitelist or IP whitelist mode, or shorten its life to rotate it. Public keys cannot be updated or deleted while they are the only public key."
  responses:
    "200":
      description: successful operation
      content:
        application/vnd.conekta-v2.3.0+json:
          schema:
            $ref: ../../schemas/api_keys/api_key_response.yml
    401:
      $ref: "../errors/401.yml"
    403:
      $ref: "../errors/403.yml"
    404:
      $ref: "../errors/404.yml"
    422:
      $ref: "../errors/422.yml"
    500:
      $ref: "../errors/500.yml"
  security:
    - bearerAuth: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../schemas/api_keys/api_key_update_request.yml"
  parameters:
    - $ref: "../../parameters/commons/path_param/id.yml"
    - $ref: "../../parameters/commons/headers/accept_language.yml"
delete:
  tags:
    - Api Keys
  operationId: deleteApiKey
  summary: Delete Api Key
  description: "Deletes an api key that corresponds to an api key ID. The key stops working immediately and the deletion cannot be undone; to stop using a key reversibly, deactivate it instead."
  responses:
    200:
      description: successful
      content:
        application/vnd.conekta-v2.3.0+json:
          schema:
            title: delete_api_keys_response
            allOf:
              - $ref: "../../schemas/api_keys/api_key_response_on_delete.yml"
              - type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
      headers:
        Content-Type:
          description: The format of the response body
          schema:
            type: string
            example: "application/json; charset=utf-8"
        Conekta-Media-Type:
          schema:
            type: string
            example: conekta-v2.3.0; format=application/json
    401:
      $ref: "../errors/401.yml"
    403:
      $ref: "../errors/403.yml"
    404:
      $ref: "../errors/404.yml"
    422:
      $ref: "../errors/422.yml"
    500:
      $ref: "../errors/500.yml"
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../parameters/commons/path_param/id.yml"
    - $ref: "../../parameters/commons/headers/accept_language.yml"

description: "Multipart form where each field name is an evidence type and its value is the file to upload for that evidence type. Include only the fields being uploaded (at most 10 per request); every field is optional."
required: true
content:
  multipart/form-data:
    schema:
      title: chargeback_files_batch_request
      type: object
      properties:
        charge_information:
          type: string
          format: binary
        contract:
          type: string
          format: binary
        other_evidence:
          type: string
          format: binary
        receipt_of_shipment:
          type: string
          format: binary
        identification:
          type: string
          format: binary
        order_details:
          type: string
          format: binary
        terms_and_conditions:
          type: string
          format: binary
        cardholder_information:
          type: string
          format: binary
        proof_invalidate_claim:
          type: string
          format: binary
        internal_validations:
          type: string
          format: binary
        proof_of_cancellation:
          type: string
          format: binary
        recurring_contract:
          type: string
          format: binary
        proof_of_return:
          type: string
          format: binary
        exhibit_8:
          type: string
          format: binary
        duplicate_analysis:
          type: string
          format: binary
        full_evidence:
          type: string
          format: binary
